name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/guard.py
