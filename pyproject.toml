[project]
name = "curriculum-auditor"
version = "0.1.0"
description = "Checks curriculum coverage and student work against a competency framework, with evidence Claude must quote and code verifies."
authors = [
    { email = "lizarum@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sympy>=1.14.0",
]

[project.scripts]
curriculum-auditor = "curriculum_auditor.cli:main"
curriculum-auditor-mcp = "curriculum_auditor.server:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
